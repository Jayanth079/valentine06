DATA.forEach((d,i)=>d.idx=i+1);
const listEl=document.getElementById('list'), countEl=document.getElementById('count'),
      qEl=document.getElementById('q'), clearEl=document.getElementById('clear');
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function hl(s,ql){if(!ql)return esc(s);const i=s.toLowerCase().indexOf(ql);if(i<0)return esc(s);
  return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+ql.length))+'</mark>'+esc(s.slice(i+ql.length));}
function render(){
  const ql=qEl.value.trim().toLowerCase();
  clearEl.style.display=ql?'block':'none';
  const rows=DATA.filter(d=>{
    if(!ql)return true;
    return (d.c+' '+d.n+' '+d.city+' '+(d.l||[]).join(' ')+' '+(d.m||[]).join(' ')).toLowerCase().includes(ql);
  });
  countEl.textContent = ql ? rows.length+' result'+(rows.length!==1?'s':'') : DATA.length+' universities';
  listEl.innerHTML='';
  if(!rows.length){listEl.innerHTML='<div class="empty">No matches.<br>Try a shorter word.</div>';return;}
  rows.forEach(d=>{
    const nb=d.l?d.l.length:0, nm=d.m?d.m.length:0;
    const sub=[d.city.split('—')[0].trim(), (nb+nm)?(nb+nm)+' English programmes':'see official list'].filter(Boolean).join(' · ');
    const off='https://www.google.com/search?q='+encodeURIComponent(d.n+' degree programmes taught in English');
    const r=document.createElement('div'); r.className='row';
    r.innerHTML=`
      <div class="row-head">
        <div class="code">${esc(d.c)}</div>
        <div class="nm"><div class="t">${hl(d.n,ql)}</div><div class="s">${hl(sub,ql)}</div></div>
        <div class="arr">▸</div>
      </div>
      <div class="det">
        ${nb?`<div class="grp">Bachelor's (English)</div><ul>${d.l.map(x=>`<li>${hl(x,ql)}</li>`).join('')}</ul>`:''}
        ${nm?`<div class="grp">Master's (English)</div><ul>${d.m.map(x=>`<li>${hl(x,ql)}</li>`).join('')}</ul>`:''}
        <a class="off" href="${off}" target="_blank" rel="noopener">Official English list ↗</a>
      </div>`;
    r.querySelector('.row-head').addEventListener('click',e=>{ if(e.target.closest('.off'))return; r.classList.toggle('open'); });
    if(ql) r.classList.add('open');
    listEl.appendChild(r);
  });
}
qEl.addEventListener('input',render);
clearEl.addEventListener('click',()=>{qEl.value='';qEl.focus();render();});
render();
